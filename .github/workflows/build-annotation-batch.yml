name: Build annotation batch queue

on:
  workflow_dispatch:
    inputs:
      input_root:
        description: Source dataset root
        required: true
        default: datasets/validated-llm-v0.1
      ontology_version:
        description: Active annotation ontology
        required: true
        default: v0.2
  push:
    branches: ["main"]
    paths:
      - "scripts/build_annotation_batch.py"
      - ".github/workflows/build-annotation-batch.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INPUT_ROOT: ${{ github.event.inputs.input_root || 'datasets/validated-llm-v0.1' }}
      ONTOLOGY_VERSION: ${{ github.event.inputs.ontology_version || 'v0.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source root
        run: |
          test -d "$INPUT_ROOT"
          test "$ONTOLOGY_VERSION" = "v0.2"
      - name: Build pending human-QA queue
        run: |
          python scripts/build_annotation_batch.py \
            --input-root "$INPUT_ROOT" \
            --ontology-version "$ONTOLOGY_VERSION" \
            --output annotation-queues/validated-llm-v0.2-candidates.jsonl
      - name: Validate queue invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("annotation-queues/validated-llm-v0.2-candidates.jsonl")
          n = 0
          projects = set()
          for line in p.read_text(encoding="utf-8").splitlines():
              r = json.loads(line)
              n += 1
              projects.add(r["project_id"])
              assert r["coordinate_space"] == "source-page"
              assert r["ontology_version"] == "v0.2"
              assert r["allowed_classes"] == ["column", "beam", "wall"]
              assert r["review_state"] == "pending-human-qa"
              assert r["labels"] == []
          assert n > 0, "no rendered source-page images found"
          print(f"Validated {n} queue records across {len(projects)} projects")
          PY
      - name: Upload queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: annotation-queue-validated-llm-v0.2
          path: annotation-queues/validated-llm-v0.2-candidates.jsonl
          if-no-files-found: error
          retention-days: 7
