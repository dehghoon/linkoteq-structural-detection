name: Build annotation batch queue

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_annotation_batch.py"
      - "scripts/materialize_source_manifest.py"
      - ".github/workflows/build-annotation-batch.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MANIFEST: datasets/source-drawings/validated-llm-source-v0.2-candidate/manifest.jsonl
      ONTOLOGY_VERSION: v0.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize canonical manifest
        run: |
          python scripts/materialize_source_manifest.py \
            --input-root datasets/validated-llm-v0.1 \
            --dataset-id validated-llm-source-v0.2-candidate \
            --output "$MANIFEST"
      - name: Validate canonical manifest
        run: |
          test -s "$MANIFEST"
      - name: Build pending human-QA queue
        run: |
          python scripts/build_annotation_batch.py \
            --manifest "$MANIFEST" \
            --ontology-version "$ONTOLOGY_VERSION" \
            --output annotation-queues/validated-llm-v0.2-candidates.jsonl
      - name: Validate queue invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("annotation-queues/validated-llm-v0.2-candidates.jsonl")
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert rows, "no plan pages in canonical manifest"
          projects=set(); ids=set()
          for r in rows:
              assert r["coordinate_space"]=="source-page"
              assert r["ontology_version"]=="v0.2"
              assert r["allowed_classes"]==["column","beam","wall"]
              assert r["review_state"]=="pending-human-qa"
              assert r["labels"]==[]
              assert r["page_role"]=="plan"
              key=(r["project_group_id"],r["source_id"],r["page_id"])
              assert key not in ids
              ids.add(key); projects.add(r["project_group_id"])
          print(f"Validated {len(rows)} plan queue records across {len(projects)} projects")
          PY
      - name: Upload queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: annotation-queue-validated-llm-v0.2
          path: annotation-queues/validated-llm-v0.2-candidates.jsonl
          if-no-files-found: error
          retention-days: 7
