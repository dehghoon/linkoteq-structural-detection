name: Acquire next verified web structural batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquire-next-web-structural-batch.yml'
      - '.github/web-batch-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils curl jq
      - name: Download verified source sets and extract selected sheets
        shell: bash
        run: |
          set -euo pipefail
          root="datasets/validated-llm-v0.1"
          tmp="$(mktemp -d)"
          # project|url|plan sheet labels|elevation sheet labels
          cat > "$tmp/projects.tsv" <<'EOF'
TAPS-Admin-Operations	https://tapsbus.com/wp-content/uploads/2024/03/2024-0325_TAPS_IFB-Construction-Documents2.pdf	S-101	A-201,A-301
Ken-Freiberg-Fire-Museum	https://solicitations.thorntonco.gov/files/filerecords/view/vendorattachment/21942/tfm---complete-drawing-set_addendum--4---05-01-25.pdf	S-101,S-102,S-103	A-201,A-301,S-301,S-302
Sedalia-House-A	https://www.sedalia.com/wp-content/uploads/0602_2025-City-of-Sedalia-Housing-Plan-A.pdf	S1.01,S1.02	A2.01,A3.01
Porterville-Plan-2	https://cms9files.revize.com/PortervilleCA/Plan-2.pdf	S-201,S-202,S-203	A-201,A-301
Multnomah-Station-Apartments	https://www.portlandoregon.gov/bds/appeals/index.cfm?action=getfile&appeal_id=18228&file_id=21985	S101,S102A,S102B,S102C,S103,S104,S105	A301,A302,A401,S304
Hallmark-Residence	https://services.austintexas.gov/edims/document.cfm?id=369868	S1,S2,S3,S5	A4.1,A4.2
Grove-197	https://braintreema.gov/DocumentCenter/View/7882/197-Grove-Architectural-Set	S1	A2,A2.1,A7
EOF
          while IFS=$'\t' read -r id url plans elevs; do
            d="$root/$id"; mkdir -p "$d/plans/images" "$d/elevations-sections/images" "$d/originals"
            pdf="$tmp/$id.pdf"
            ok=false
            if curl -L --fail --retry 2 -A 'Mozilla/5.0' "$url" -o "$pdf" && pdfinfo "$pdf" >/dev/null 2>&1; then
              ok=true
              cp "$pdf" "$d/originals/source.pdf"
              pdftotext -layout "$pdf" "$tmp/$id.txt" || true
              python3 - "$pdf" "$tmp/$id.txt" "$d" "$plans" "$elevs" <<'PY'
import sys,re,subprocess,os,json
pdf,txt,out,plans,elevs=sys.argv[1:]
labels=[(x.strip(),'plans') for x in plans.split(',') if x.strip()]+[(x.strip(),'elevations-sections') for x in elevs.split(',') if x.strip()]
raw=open(txt,errors='ignore').read()
pages=raw.split('\f')
found=[]
for label,role in labels:
    # exact-ish sheet token; inspect extracted page text, never use first generic keyword
    pat=re.compile(r'(?<![A-Za-z0-9])'+re.escape(label)+r'(?![A-Za-z0-9])',re.I)
    hits=[i+1 for i,p in enumerate(pages) if pat.search(p)]
    # Prefer page where label is accompanied by expected title terms.
    terms=('FOUNDATION','FRAMING','PLAN') if role=='plans' else ('ELEVATION','SECTION')
    ranked=sorted(hits,key=lambda n:sum(t in pages[n-1].upper() for t in terms),reverse=True)
    if not ranked: continue
    p=ranked[0]
    base=re.sub(r'[^A-Za-z0-9_.-]+','_',label)
    outpdf=f"{out}/{role}/{base}.pdf"
    subprocess.run(['pdfseparate','-f',str(p),'-l',str(p),pdf,outpdf],check=True)
    prefix=f"{out}/{role}/images/{base}"
    subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','200',outpdf,prefix],check=True)
    found.append({'sheet':label,'role':role,'source_page':p,'pdf':os.path.relpath(outpdf,out),'image':os.path.relpath(prefix+'.png',out)})
json.dump({'project_id':os.path.basename(out),'source_url':sys.argv[0] if False else None,'status':'materialized_from_verified_web_source','selected_sheets':found},open(f"{out}/provenance.partial.json",'w'),indent=2)
PY
            fi
            jq -n --arg id "$id" --arg url "$url" --argjson downloaded "$ok" --arg plans "$plans" --arg elevs "$elevs"               '{project_id:$id,source_url:$url,pdf_downloaded:$downloaded,expected_plan_sheets:$plans,expected_elevation_section_sheets:$elevs,status:(if $downloaded then "source_downloaded_selected_sheets_materialized" else "source_download_failed_image_capture_required" end)}' > "$d/provenance.json"
            rm -f "$d/provenance.partial.json"
            printf 'Project: %s\nSource: %s\nPDF downloaded: %s\nExpected plans: %s\nExpected elevations/sections: %s\n' "$id" "$url" "$ok" "$plans" "$elevs" > "$d/README.txt"
          done < "$tmp/projects.tsv"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/validated-llm-v0.1
          git diff --cached --quiet || git commit -m "Acquire verified web structural batch with sheet PNGs"
          git push
