name: Acquire next verified web structural batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquire-next-web-structural-batch.yml'
      - '.github/web-batch-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils curl jq
      - name: Download verified source sets and extract selected sheets
        shell: bash
        run: |
          set -euo pipefail
          root="datasets/validated-llm-v0.1"
          tmp="$(mktemp -d)"
          # project|url|plan sheet labels|elevation sheet labels
          : > "$tmp/projects.tsv"
          printf '%s\t%s\t%s\t%s\n' "TAPS-Admin-Operations" "https://tapsbus.com/wp-content/uploads/2024/03/2024-0325_TAPS_IFB-Construction-Documents2.pdf" "S-101" "A-201,A-301" >> "$tmp/projects.tsv"
          printf '%s\t%s\t%s\t%s\n' "Ken-Freiberg-Fire-Museum" "https://solicitations.thorntonco.gov/files/filerecords/view/vendorattachment/21942/tfm---complete-drawing-set_addendum--4---05-01-25.pdf" "S-101,S-102,S-103" "A-201,A-301,S-301,S-302" >> "$tmp/projects.tsv"
          printf '%s\t%s\t%s\t%s\n' "Sedalia-House-A" "https://www.sedalia.com/wp-content/uploads/0602_2025-City-of-Sedalia-Housing-Plan-A.pdf" "S1.01,S1.02" "A2.01,A3.01" >> "$tmp/projects.tsv"
          printf '%s\t%s\t%s\t%s\n' "Porterville-Plan-2" "https://cms9files.revize.com/PortervilleCA/Plan-2.pdf" "S-201,S-202,S-203" "A-201,A-301" >> "$tmp/projects.tsv"
          printf '%s\t%s\t%s\t%s\n' "Multnomah-Station-Apartments" "https://www.portlandoregon.gov/bds/appeals/index.cfm?action=getfile&appeal_id=18228&file_id=21985" "S101,S102A,S102B,S102C,S103,S104,S105" "A301,A302,A401,S304" >> "$tmp/projects.tsv"
          printf '%s\t%s\t%s\t%s\n' "Hallmark-Residence" "https://services.austintexas.gov/edims/document.cfm?id=369868" "S1,S2,S3,S5" "A4.1,A4.2" >> "$tmp/projects.tsv"
          printf '%s\t%s\t%s\t%s\n' "Grove-197" "https://braintreema.gov/DocumentCenter/View/7882/197-Grove-Architectural-Set" "S1" "A2,A2.1,A7" >> "$tmp/projects.tsv"
          while IFS=$'\t' read -r id url plans elevs; do
            d="$root/$id"; mkdir -p "$d/plans/images" "$d/elevations-sections/images" "$d/originals"
            pdf="$tmp/$id.pdf"
            ok=false
            if curl -L --fail --retry 2 -A 'Mozilla/5.0' "$url" -o "$pdf" && pdfinfo "$pdf" >/dev/null 2>&1; then
              ok=true
              cp "$pdf" "$d/originals/source.pdf"
              pdftotext -layout "$pdf" "$tmp/$id.txt" || true
              # Extract pages by verified sheet labels. Keep logic in shell to avoid YAML heredoc indentation issues.
              IFS=',' read -ra plan_arr <<< "$plans"
              IFS=',' read -ra elev_arr <<< "$elevs"
              for role in plans elevations-sections; do
                if [ "$role" = "plans" ]; then arr=( "${plan_arr[@]}" ); else arr=( "${elev_arr[@]}" ); fi
                for label in "${arr[@]}"; do
                  label="$(echo "$label" | xargs)"
                  [ -n "$label" ] || continue
                  page="$(awk -v RS='\f' -v s="$label" 'index(toupper($0),toupper(s)){print NR; exit}' "$tmp/$id.txt" || true)"
                  [ -n "$page" ] || continue
                  safe="$(echo "$label" | sed 's/[^A-Za-z0-9_.-]/_/g')"
                  outpdf="$d/$role/$safe.pdf"
                  pdfseparate -f "$page" -l "$page" "$pdf" "$outpdf"
                  pdftoppm -f 1 -singlefile -png -r 200 "$outpdf" "$d/$role/images/$safe"
                done
              done
            fi
            jq -n --arg id "$id" --arg url "$url" --argjson downloaded "$ok" --arg plans "$plans" --arg elevs "$elevs"               '{project_id:$id,source_url:$url,pdf_downloaded:$downloaded,expected_plan_sheets:$plans,expected_elevation_section_sheets:$elevs,status:(if $downloaded then "source_downloaded_selected_sheets_materialized" else "source_download_failed_image_capture_required" end)}' > "$d/provenance.json"
            rm -f "$d/provenance.partial.json"
            printf 'Project: %s\nSource: %s\nPDF downloaded: %s\nExpected plans: %s\nExpected elevations/sections: %s\n' "$id" "$url" "$ok" "$plans" "$elevs" > "$d/README.txt"
          done < "$tmp/projects.tsv"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/validated-llm-v0.1
          git diff --cached --quiet || git commit -m "Acquire verified web structural batch with sheet PNGs"
          git push
