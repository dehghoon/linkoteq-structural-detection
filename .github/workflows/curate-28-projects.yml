name: Curate 28 paired structural projects
# rerun trigger: partial-results fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/curate_28_projects.py'
      - '.github/workflows/curate-28-projects.yml'
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pillow
      - run: python scripts/curate_28_projects.py
      - name: Commit curated sheets
        run: |
          git config user.name "linkoteq-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datasets/web-sourced-candidates-v0.1/curated-28-projects
          git add datasets/web-sourced-candidates-v0.1/curated-28-projects-manifest.tsv
          git commit -m "Materialize 28 paired plan-elevation projects" || exit 0
          git push
