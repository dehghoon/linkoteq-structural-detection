name: Prepare remaining 29 detection review candidates

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Ref containing run 36530901509 previews
        required: true
        default: qa-review-artifacts
      model_path:
        description: Optional repo-relative path to an approved v0.2 column/beam/wall YOLO model
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source review ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate and materialize 29-item batch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_remaining_29.py

      - name: Run approved v0.2 detector if provided
        if: ${{ inputs.model_path != '' }}
        shell: bash
        env:
          MODEL_PATH: ${{ inputs.model_path }}
        run: |
          set -euo pipefail
          test -f "$MODEL_PATH"
          python -m pip install --quiet 'ultralytics>=8.3.0' 'Pillow>=10.0'
          python scripts/run_remaining_29_detector.py --model "$MODEL_PATH"

      - name: Record guarded no-model state
        if: ${{ inputs.model_path == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("runs/36530901509/review-batches/remaining-29/work/detector-status.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              "status": "model-unavailable",
              "candidates_generated": False,
              "reason": "No approved v0.2 column/beam/wall model_path was provided; no boxes fabricated.",
              "training_enabled": False
          }, indent=2) + "\n")
          PY

      - name: Upload review workpack
        uses: actions/upload-artifact@v4
        with:
          name: remaining-29-v0.2-review-workpack
          path: runs/36530901509/review-batches/remaining-29/work
          retention-days: 30
          if-no-files-found: error
