name: Build remaining 15 hi-res QA sources from PDF

on:
  workflow_dispatch:
    inputs:
      dpi:
        description: "Raster DPI"
        required: false
        default: "400"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main dataset
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout QA review metadata
        uses: actions/checkout@v4
        with:
          ref: qa-review-artifacts
          path: .qa-review
          sparse-checkout: |
            runs/36530901509/images/human-annotation-pack.json

      - name: Validate builder source
        run: |
          git rev-parse --short HEAD
          sha256sum scripts/build_remaining_15_hires.py
          python3 -m py_compile scripts/build_remaining_15_hires.py

      - name: Install PDF rasterizer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build hi-res source pack
        run: |
          python3 scripts/build_remaining_15_hires.py \
            --pack ".qa-review/runs/36530901509/images/human-annotation-pack.json" \
            --out "artifacts/remaining-15-hires" \
            --dpi "${{ inputs.dpi }}"

      - name: Upload hi-res QA source pack
        uses: actions/upload-artifact@v4
        with:
          name: remaining-15-hires-qa-sources
          path: artifacts/remaining-15-hires
          if-no-files-found: error
          retention-days: 14
