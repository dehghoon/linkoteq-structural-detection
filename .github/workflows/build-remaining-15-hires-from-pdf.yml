name: Build remaining 15 hi-res QA sources from PDF

on:
  workflow_dispatch:
    inputs:
      dpi:
        description: "Raster DPI"
        required: false
        default: "400"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main dataset
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout QA review metadata
        uses: actions/checkout@v4
        with:
          ref: qa-review-artifacts
          path: .qa-review
          sparse-checkout: |
            runs/36530901509/images/human-annotation-pack.json

      - name: Validate builder and preflight source
        run: |
          set -euo pipefail
          git rev-parse --short HEAD
          sha256sum scripts/build_remaining_15_hires.py scripts/preflight_remaining_15_hires.py
          python3 -m py_compile scripts/build_remaining_15_hires.py
          python3 -m py_compile scripts/preflight_remaining_15_hires.py
          python3 scripts/preflight_remaining_15_hires.py             --pack ".qa-review/runs/36530901509/images/human-annotation-pack.json"

      - name: Install PDF rasterizer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build hi-res source pack
        run: |
          set -euo pipefail
          python3 scripts/build_remaining_15_hires.py             --pack ".qa-review/runs/36530901509/images/human-annotation-pack.json"             --out "artifacts/remaining-15-hires"             --dpi "${{ inputs.dpi }}"

      - name: Verify artifact count
        run: |
          set -euo pipefail
          test -f artifacts/remaining-15-hires/manifest.json
          count=$(find artifacts/remaining-15-hires -maxdepth 1 -type f -name '*.png' | wc -l)
          test "$count" -eq 15
          echo "ARTIFACT PASS: 15/15 PNG"

      - name: Upload hi-res QA source pack
        uses: actions/upload-artifact@v4
        with:
          name: remaining-15-hires-qa-sources
          path: artifacts/remaining-15-hires
          if-no-files-found: error
          retention-days: 14
