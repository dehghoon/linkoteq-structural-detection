name: Trigger staged QA review wave

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/trigger-staged-qa.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch contract-validated staged QA pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST "\n            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dehghoon/linkoteq-structural-detection/actions/workflows/build-annotation-batch.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched Build annotation batch queue on main via GitHub REST API."
