name: Curate 100 paired structural projects
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/curate_100_projects.py'
      - '.github/workflows/curate-100-projects.yml'
      - 'datasets/web-sourced-candidates-v0.1/exa-*.md'
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pillow
      - run: python scripts/curate_100_projects.py
      - name: Commit curated PDFs
        run: |
          git config user.name "linkoteq-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datasets/web-sourced-candidates-v0.1/curated-100-projects
          git add datasets/web-sourced-candidates-v0.1/curated-100-projects-manifest.tsv
          git commit -m "Materialize paired PDFs toward 100 projects" || exit 0
          git push
