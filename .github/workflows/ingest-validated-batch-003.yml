name: Ingest validated batch 003
on:
  push:
    branches: [main]
    paths:
      - 'Linkoteq_validated_batch_003_part1.zip'
      - 'Linkoteq_validated_batch_003_part2.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract batch 003
        run: |
          mkdir -p datasets/validated-llm-v0.1
          unzip -o Linkoteq_validated_batch_003_part1.zip -d datasets/validated-llm-v0.1
          unzip -o Linkoteq_validated_batch_003_part2.zip -d datasets/validated-llm-v0.1
          rm Linkoteq_validated_batch_003_part1.zip Linkoteq_validated_batch_003_part2.zip
      - name: Commit extracted projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Ingest validated batch 003"
          git push
