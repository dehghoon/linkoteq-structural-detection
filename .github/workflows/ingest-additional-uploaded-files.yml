name: Ingest additional uploaded structural files
on:
  push:
    branches: [main]
    paths:
      - 'Linkoteq_additional_uploaded_files_part1.zip'
      - 'Linkoteq_additional_uploaded_files_part2.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded structural files
        run: |
          mkdir -p datasets/validated-llm-v0.1
          unzip -o Linkoteq_additional_uploaded_files_part1.zip -d datasets/validated-llm-v0.1
          unzip -o Linkoteq_additional_uploaded_files_part2.zip -d datasets/validated-llm-v0.1
          rm Linkoteq_additional_uploaded_files_part1.zip Linkoteq_additional_uploaded_files_part2.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Ingest additional uploaded structural files"
          git push
