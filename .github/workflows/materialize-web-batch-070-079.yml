name: Materialize verified web batch 070-079
on:
  push:
    branches: [main]
    paths:
      - 'datasets/web-batches/.trigger-070-079'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Materialize exact verified sheets
        run: python scripts/materialize_verified_web_sheets.py datasets/web-batches/batch-070-079.json datasets/validated-llm-v0.1
      - name: Commit batch
        run: |
          git config user.name "linkoteq-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datasets/validated-llm-v0.1
          git diff --cached --quiet || git commit -m "Materialize verified web projects 070-079"
          git push
