name: Recover QA review mirror

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-qa-review-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MANIFEST: datasets/source-drawings/validated-llm-source-v0.2-candidate/manifest.jsonl
      QUEUE: annotation-queues/validated-llm-v0.2-candidates.jsonl
      QA_BATCH_DIR: annotation-queues/qa-batches-v0.2
      REVIEWER_ARTIFACT_DIR: annotation-queues/reviewer-artifacts-v0.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize runtime manifest
        run: python scripts/materialize_source_manifest.py --input-root datasets/validated-llm-v0.1 --dataset-id validated-llm-source-v0.2-candidate --output "$MANIFEST"
      - name: Build queue
        run: python scripts/build_annotation_batch.py --manifest "$MANIFEST" --ontology-version v0.2 --output "$QUEUE"
      - name: Build same 20-project-group staged wave
        run: python scripts/build_qa_batches.py --input "$QUEUE" --output-dir "$QA_BATCH_DIR" --target-pages 20 --review-project-groups 20
      - name: Build and contract-validate reviewer artifact
        run: python scripts/build_candidate_review_artifacts.py --qa-dir "$QA_BATCH_DIR" --output-dir "$REVIEWER_ARTIFACT_DIR" --contract contracts/candidate-qa-gates-v0.2.json
      - name: Validate strict readonly QA invariants
        run: python -c 'import json,pathlib; r=pathlib.Path("annotation-queues/reviewer-artifacts-v0.2"); i=json.loads((r/"index.json").read_text()); assert i["contract_id"]=="candidate-qa-gates-v0.2" and i["contract_validated"] is True and i["review_wave_project_groups"]==20 and i["review_state"]=="pending-human-qa" and i["training_eligible"] is False and i["ground_truth"] is False and i["empty_candidate_semantics"]=="unreviewed-not-background"; rows=[json.loads(x) for a in i["artifacts"] for x in pathlib.Path(a["path"]).read_text().splitlines() if x.strip()]; assert rows and len({x["project_group_id"] for x in rows})==20; assert all(x["allowed_classes"]==["column","beam","wall"] and x["coordinate_space"]=="source-page" and x["review"]["state"]=="pending-human-qa" and x["training_eligible"] is False and x["ground_truth"] is False and x["candidates"]==[] and x["empty_candidate_semantics"]=="unreviewed-not-background" and "engineering_geometry" not in x and "reconstruction" not in x for x in rows); print(f"Validated {len(rows)} review records across 20 project groups")'
      - name: Prepare snapshot
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/candidate-review-wave-v0.2
          mkdir -p /tmp/candidate-review-wave-v0.2
          cp -a "$REVIEWER_ARTIFACT_DIR"/. /tmp/candidate-review-wave-v0.2/
          python -c 'import json,os,pathlib; pathlib.Path("/tmp/candidate-review-wave-v0.2/mirror-metadata.json").write_text(json.dumps({"source_workflow_run_id":int(os.environ["RUN_ID"]),"source_head_sha":os.environ["HEAD_SHA"],"review_state":"pending-human-qa","training_eligible":False,"ground_truth":False,"purpose":"read-only-human-qa-handoff"},indent=2,sort_keys=True)+"\\n")'
      - name: Publish QA snapshot
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin qa-review-artifacts:refs/remotes/origin/qa-review-artifacts || true
          if git show-ref --quiet refs/remotes/origin/qa-review-artifacts; then
            git checkout -B qa-review-artifacts origin/qa-review-artifacts
          else
            git checkout --orphan qa-review-artifacts
            git rm -rf . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "runs/$RUN_ID"
          cp -a /tmp/candidate-review-wave-v0.2/. "runs/$RUN_ID/"
          git add "runs/$RUN_ID"
          git commit -m "Mirror candidate review wave from run $RUN_ID"
          git push origin qa-review-artifacts
