name: Structural Layout Proposal Validation

on:
  push:
    paths:
      - "contracts/structural-layout-proposal*"
      - "tools/validate_structural_layout_proposal.py"
      - "tests/test_structural_layout_proposal_validation.py"
      - ".github/workflows/structural-layout-proposal-validation.yml"
  pull_request:
    paths:
      - "contracts/structural-layout-proposal*"
      - "tools/validate_structural_layout_proposal.py"
      - "tests/test_structural_layout_proposal_validation.py"
      - ".github/workflows/structural-layout-proposal-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run StructuralLayoutProposal regressions
        run: python -m pytest -q  tests/test_structural_layout_proposal_validation.py
