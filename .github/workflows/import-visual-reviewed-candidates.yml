name: Import visual-reviewed candidate PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-visual-reviewed-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reviewed-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract visually reviewed candidate archive
        shell: bash
        run: |
          set -euo pipefail
          root='datasets/review-candidates-v0.2'
          zip="$root/review-candidates-v0.2-visual-reviewed.zip"
          test -f "$zip"

          tmp="$(mktemp -d)"
          unzip -q "$zip" -d "$tmp"
          echo 'Archive contents:'
          find "$tmp" -type f -print | sort

          # The reviewed archive is intentionally flat. Map each visually
          # reviewed PDF explicitly; do not infer project/role from sheet title.
          projects=(
            Cullen-Martin-St-Residence
            Mesecher-Goudreau-Residence
            Port-Wentworth
            Tuscaloosa-DHR-Building-1
          )
          for project in "${projects[@]}"; do
            rm -rf "$root/$project/plans" "$root/$project/elevations-sections"
            mkdir -p "$root/$project/plans" "$root/$project/elevations-sections"
          done

          put() {
            project="$1"; role="$2"; file="$3"
            test -f "$tmp/$file" || { echo "Missing reviewed file: $file"; exit 1; }
            cp "$tmp/$file" "$root/$project/$role/$file"
          }

          # Cullen-Martin-St Residence
          put Cullen-Martin-St-Residence plans 'S-1.0_First-Floor-Framing-Plan.pdf'
          put Cullen-Martin-St-Residence plans 'S-1.1_Second-Floor-Framing-Plan.pdf'
          put Cullen-Martin-St-Residence plans 'S-1.3_Roof-Framing-Plan.pdf'
          put Cullen-Martin-St-Residence elevations-sections 'A-2.0_Exterior-Elevations.pdf'
          put Cullen-Martin-St-Residence elevations-sections 'A-2.1_Exterior-Elevations.pdf'

          # Mesecher-Goudreau Residence
          put Mesecher-Goudreau-Residence plans 'S1_Foundation-Plan.pdf'
          put Mesecher-Goudreau-Residence plans 'S2_2nd-Floor-Lower-Roof-Framing.pdf'
          put Mesecher-Goudreau-Residence plans 'S3_Second-Floor-Ceiling-Framing.pdf'
          put Mesecher-Goudreau-Residence plans 'S4_Upper-Roof-Framing.pdf'
          put Mesecher-Goudreau-Residence elevations-sections 'A8_Building-Sections.pdf'

          # Port Wentworth
          put Port-Wentworth plans 'S-101_Foundation-Plan.pdf'
          put Port-Wentworth plans 'S-120_Second-Level-Apparatus-Roof-Framing.pdf'
          put Port-Wentworth plans 'S-151_Roof-Framing-Plan.pdf'
          put Port-Wentworth elevations-sections 'A-201_Exterior-Elevations.pdf'
          put Port-Wentworth elevations-sections 'A-202_Exterior-Elevations.pdf'
          put Port-Wentworth elevations-sections 'A-301_Building-Sections.pdf'
          put Port-Wentworth elevations-sections 'A-302_Building-Sections.pdf'

          # Tuscaloosa DHR Building 1
          put Tuscaloosa-DHR-Building-1 plans 'S2.01_Floor-and-Foundation-Plan.pdf'
          put Tuscaloosa-DHR-Building-1 plans 'S2.02_Roof-Framing-Plan.pdf'
          put Tuscaloosa-DHR-Building-1 elevations-sections 'A-3.0_Building-Section.pdf'
          put Tuscaloosa-DHR-Building-1 elevations-sections 'A-3.1_Building-Section.pdf'
          put Tuscaloosa-DHR-Building-1 elevations-sections 'S3.02_Structural-Sections.pdf'

          # Exact archive and destination guards.
          archive_count="$(find "$tmp" -type f -name '*.pdf' | wc -l)"
          pdf_count="$(find "$root" \( -path '*/plans/*.pdf' -o -path '*/elevations-sections/*.pdf' \) -type f | wc -l)"
          echo "Archive PDF count: $archive_count"
          echo "Installed reviewed PDF count: $pdf_count"
          test "$archive_count" -eq 22
          test "$pdf_count" -eq 22

          bad="$(find "$root" \( -path '*/plans/*' -o -path '*/elevations-sections/*' \) -type f ! -name '*.pdf' -print)"
          test -z "$bad" || { echo "Unexpected non-PDF files:"; echo "$bad"; exit 1; }

          rm -f "$zip"

      - name: Commit reviewed candidate PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A datasets/review-candidates-v0.2
          git diff --cached --quiet && { echo 'No candidate changes to commit.'; exit 0; }
          git commit -m 'Import 22 visually reviewed plan and elevation candidates'
          git push origin HEAD:main
