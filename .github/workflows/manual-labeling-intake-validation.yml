name: Manual Labeling Intake Contract Validation

on:
  push:
    paths:
      - "contracts/manual-labeling-intake-v0.1.md"
      - "contracts/manual-labeling-intake-validation-rules-v0.1.json"
      - "tests/test_manual_labeling_intake_contract.py"
      - ".github/workflows/manual-labeling-intake-validation.yml"
  pull_request:
    paths:
      - "contracts/manual-labeling-intake-v0.1.md"
      - "contracts/manual-labeling-intake-validation-rules-v0.1.json"
      - "tests/test_manual_labeling_intake_contract.py"
      - ".github/workflows/manual-labeling-intake-validation.yml"

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manual labeling intake contract
        run: python -m unittest tests/test_manual_labeling_intake_contract.py -v
